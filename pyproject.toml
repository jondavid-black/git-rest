[project]
name = "git-rest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "flask>=3.1.2",
    "gitpython>=3.1.45",
    "gunicorn>=23.0.0",
    "pydantic>=2.12.0",
    "pyjwt>=2.10.1",
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = [
    "behave>=1.3.3",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.21",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
]

[project.scripts]
git-rest-debug = "git_rest.__main__:main"

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I", "W", "UP", "B"] # A good starting set of rules

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src --cov-report=html --cov-fail-under=75"
testpaths = [
    "tests/unit",
]

[tool.behave]
paths = ["tests/bdd"]
format = ["pretty"]