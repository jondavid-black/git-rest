openapi: 3.1.0
info:
  title: git-rest API
  version: 0.1.0
  description: REST API for git-backed content management
servers:
  - url: /api
paths:
  /repos:
    get:
      summary: List all managed repositories
      responses:
        '200':
          description: List of repositories
    post:
      summary: Clone a new repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                name:
                  type: string
              required:
                - url
                - name
      responses:
        '201':
          description: Repository cloned
  /repos/{repo_id}:
    get:
      summary: Get repository details
      parameters:
        - in: path
          name: repo_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Repository details
  /repos/{repo_id}/branches:
    get:
      summary: List branches
      parameters:
        - in: path
          name: repo_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of branches
    post:
      summary: Create a new branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
                - name
      responses:
        '201':
          description: Branch created
  /repos/{repo_id}/branches/{branch}:
    post:
      summary: Switch to branch
      parameters:
        - in: path
          name: repo_id
          required: true
          schema:
            type: string
        - in: path
          name: branch
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Switched branch
    delete:
      summary: Delete branch
      parameters:
        - in: path
          name: repo_id
          required: true
          schema:
            type: string
        - in: path
          name: branch
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Branch deleted
  /repos/{repo_id}/commit:
    post:
      summary: Commit changes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
              required:
                - message
      responses:
        '201':
          description: Commit created
  /repos/{repo_id}/diff:
    get:
      summary: Get diff between commits
      parameters:
        - in: path
          name: repo_id
          required: true
          schema:
            type: string
        - in: query
          name: from
          required: true
          schema:
            type: string
        - in: query
          name: to
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Diff result
  /repos/{repo_id}/files:
    get:
      summary: List files in repository
      parameters:
        - in: path
          name: repo_id
          required: true
          schema:
            type: string
        - in: query
          name: path
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of files
  /repos/{repo_id}/files/{file_path}:
    get:
      summary: Get file contents
      parameters:
        - in: path
          name: repo_id
          required: true
          schema:
            type: string
        - in: path
          name: file_path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File contents or download link
