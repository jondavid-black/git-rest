openapi: 3.0.3
info:
  title: git-rest Testing API
  version: 1.0.0
paths:
  /repositories:
    get:
      summary: List all repositories
      responses:
        '200':
          description: A list of repositories
    post:
      summary: Clone a new repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
      responses:
        '201':
          description: Repository cloned
  /repositories/{repo}/branches:
    get:
      summary: List all branches in a repository
      parameters:
        - in: path
          name: repo
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of branches
    post:
      summary: Create a new branch
      parameters:
        - in: path
          name: repo
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Branch created
  /repositories/{repo}/branches/{branch}/commits:
    post:
      summary: Commit changes to a branch
      parameters:
        - in: path
          name: repo
          required: true
          schema:
            type: string
        - in: path
          name: branch
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
      responses:
        '201':
          description: Commit created
  /repositories/{repo}/pull:
    post:
      summary: Pull latest changes from main
      parameters:
        - in: path
          name: repo
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pulled successfully
  /repositories/{repo}/merge:
    post:
      summary: Merge a branch (PR emulation)
      parameters:
        - in: path
          name: repo
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source_branch:
                  type: string
                target_branch:
                  type: string
      responses:
        '200':
          description: Branch merged
  /repositories/{repo}/push:
    post:
      summary: Push changes to origin
      parameters:
        - in: path
          name: repo
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pushed successfully
