openapi: 3.0.3
info:
  title: Init New Repo API
  version: 1.0.0
paths:
  /users/{user_id}/repos/init:
    post:
      summary: Create and initialize a new repository for a user
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                repo_name:
                  type: string
                  pattern: '^[A-Za-z0-9_-]+$'
                  description: Name for the new repository (unique per user)
              required:
                - repo_name
      responses:
        '200':
          description: Repository created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    description: URL to the newly created repository
        '400':
          description: Invalid input or repo already exists
        '404':
          description: User not found
        '500':
          description: Internal server error
