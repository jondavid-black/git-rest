openapi: 3.0.3
info:
  title: User-Segregated Git REST API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /users/{user_id}/repos:
    get:
      summary: List repositories for a user
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of repositories
    post:
      summary: Create a new repository for a user
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Repository created
  /users/{user_id}/repos/{repo_id}:
    get:
      summary: Get repository details
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
        - in: path
          name: repo_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Repository details
    delete:
      summary: Delete a repository
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
        - in: path
          name: repo_id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Repository deleted
  /users/{user_id}/repos/{repo_id}/branches:
    get:
      summary: List branches in a repository
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
        - in: path
          name: repo_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of branches
    post:
      summary: Create a branch
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
        - in: path
          name: repo_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Branch created
  /users/{user_id}/repos/{repo_id}/branches/{branch_id}:
    get:
      summary: Get branch details
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
        - in: path
          name: repo_id
          required: true
          schema:
            type: string
        - in: path
          name: branch_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Branch details
    delete:
      summary: Delete a branch
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
        - in: path
          name: repo_id
          required: true
          schema:
            type: string
        - in: path
          name: branch_id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Branch deleted
  /users/{user_id}/repos/{repo_id}/branches/{branch_id}/files:
    get:
      summary: List files in a branch
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
        - in: path
          name: repo_id
          required: true
          schema:
            type: string
        - in: path
          name: branch_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of files
    post:
      summary: Create or upload a file
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
        - in: path
          name: repo_id
          required: true
          schema:
            type: string
        - in: path
          name: branch_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                content:
                  type: string
      responses:
        '201':
          description: File created
  /users/{user_id}/repos/{repo_id}/branches/{branch_id}/files/{file_id}:
    get:
      summary: Get file details
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
        - in: path
          name: repo_id
          required: true
          schema:
            type: string
        - in: path
          name: branch_id
          required: true
          schema:
            type: string
        - in: path
          name: file_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File details
    delete:
      summary: Delete a file
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
        - in: path
          name: repo_id
          required: true
          schema:
            type: string
        - in: path
          name: branch_id
          required: true
          schema:
            type: string
        - in: path
          name: file_id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: File deleted
  /users/{user_id}/audit-log:
    get:
      summary: Get audit log for a user
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Audit log entries
