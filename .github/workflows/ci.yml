name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install system libraries for Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-1 libgraphene-1.0-0 libxslt1.1 libvpx9 libevent-2.1-7t64 libopus0 libflite1 libwebpdemux2 libavif16 libharfbuzz-icu0 libwebpmux3 libenchant-2-2 libsecret-1-0 libhyphen0 libmanette-0.2-0 libx264-164
          # GStreamer and woff2 libraries (may have different names on some distros)
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav woff2
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Create uv virtual environment
        run: uv venv
      # Removed manual venv activation; uv handles this automatically
      - name: Install dependencies
        run: uv pip install -e .[dev]
      - name: Lint with ruff
        run: uv run ruff check src tests
      - name: Format with ruff
        run: uv run ruff format src tests
      - name: Run unit tests (pytest)
        run: uv run pytest
      - name: Run BDD tests (behave)
        run: uv run behave
      - name: Build documentation (Mkdocs)
        run: uv run mkdocs build
      - name: Build Docker image
        run: docker build -t git-rest .
      - name: Tag and release (on main only)
        if: github.ref == 'refs/heads/main'
        run: echo "Tag and release steps go here"
